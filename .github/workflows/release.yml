name: Release TXT Sheets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.20.0
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($packageVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match package version $packageVersion."
          }
      - name: Run checks
        run: pnpm check
      - name: Prepare draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --draft --generate-notes --verify-tag --title "TXT Sheets ${{ github.ref_name }}"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm release:github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish completed release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TXT-Sheets-Windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn
